# syno-workspace-mcp for Synology Container Manager (no SSH, no .env file).
# Paste this file in Container Manager > Project > Create, then replace the one
# CHANGE_ME value. Everything else is configured from the /setup page once the
# server runs. See docs/install-container-manager.md.
#
# Keep the double quotes. Secret: letters, digits and hyphens only.

services:
  spreadsheet-api:
    image: synology/spreadsheet-api@sha256:f991f0146749f94f5a8268374ebb9dace498e7a5f18863e67a5934518506d5fd
    container_name: synology-spreadsheet-api
    restart: unless-stopped
    # Host networking: Docker's bridge network cannot reach DSM on Synology.
    network_mode: host
    environment:
      # Random string used only by this container, for example 40 characters.
      AUTH_SECRET: "CHANGE_ME_SPREADSHEET_SECRET"
      HOST: "127.0.0.1"
      PORT: "3000"

  mcp:
    image: ghcr.io/alexcane/syno-workspace-mcp:1.2.0
    container_name: syno-workspace-mcp
    # Also restarts the server once /setup has saved the configuration.
    restart: unless-stopped
    network_mode: host
    environment:
      SYNO_SS_API_URL: "http://127.0.0.1:3000"
      SYNO_MODULES: "drive,spreadsheet"
      MCP_HOST: "127.0.0.1"
      MCP_PORT: "3100"
      DATA_DIR: "/data"
      LOG_LEVEL: "INFO"
      # Uncomment to run the /setup page again (new token, other DSM account...),
      # then comment it out once setup is done.
      # SETUP_MODE: "true"
    volumes:
      # Holds the configuration saved by /setup, the DSM password and the
      # access token included (secrets.json, readable by the server only).
      - ./data:/data
    depends_on:
      - spreadsheet-api
