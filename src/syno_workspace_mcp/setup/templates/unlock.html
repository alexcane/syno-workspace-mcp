{% extends "base.html" %}
{% block steps %}<p class="steps"><b>1. Access</b> · 2. Exposure · 3. DSM account · 4. Summary</p>{% endblock %}
{% block content %}
<p>Enter the setup code shown in the server log: in Container Manager, open the
<code>syno-workspace-mcp</code> container, then its <b>Log</b> tab.</p>
<form method="post" action="/setup/unlock">
  <label for="code">Setup code</label>
  <input type="text" id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" required autofocus>
  <button type="submit">Continue</button>
</form>
{% endblock %}
