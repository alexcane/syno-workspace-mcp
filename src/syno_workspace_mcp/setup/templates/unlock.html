{% extends "base.html" %}
{% set step = 1 %}
{% block content %}
<section class="card">
  <h2>Enter the setup code</h2>
  <p class="hint">It is printed in the server log: in Container Manager, open the
  <code>syno-workspace-mcp</code> container, then its <b>Log</b> tab, and look for the
  line <code>Setup code: …</code>. Pasting the whole line works too.</p>
  <form method="post" action="/setup/unlock">
    <div class="field">
      <label for="code">Setup code</label>
      <input type="text" id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD2345" required autofocus>
    </div>
    <div class="actions"><button type="submit">Continue</button></div>
  </form>
</section>
{% endblock %}
