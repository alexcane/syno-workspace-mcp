name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check compose files are in sync
        run: |
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          main=deploy/docker-compose.yml
          cm=deploy/container-manager/docker-compose.yml
          grep -q "syno-workspace-mcp:\${MCP_IMAGE_TAG:-${version}}" "$main" \
            || { echo "$main: default image tag is not ${version}" >&2; exit 1; }
          grep -q "syno-workspace-mcp:${version}\$" "$cm" \
            || { echo "$cm: image tag is not ${version}" >&2; exit 1; }
          [ "$(grep 'image: synology/' "$main")" = "$(grep 'image: synology/' "$cm")" ] \
            || { echo "Spreadsheet image differs between compose files" >&2; exit 1; }

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing

      - name: Build landing page
        run: uv run python landing/build.py --out "$RUNNER_TEMP/site"

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcpb
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcpb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test bridge
        run: npm test

      - name: Pack extension
        run: npm run pack
