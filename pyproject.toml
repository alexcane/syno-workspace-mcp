[project]
name = "syno-workspace-mcp"
version = "1.1.0"
description = "MCP server for Synology Drive and Spreadsheet, built with FastMCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp==4.2.*",
    "httpx>=0.28,<0.29",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
]

[project.scripts]
syno-workspace-mcp = "syno_workspace_mcp.__main__:main"

[dependency-groups]
dev = [
    "inline-snapshot>=0.36",
    "mypy>=1.18",
    "pytest>=9",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7",
    "respx>=0.23",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syno_workspace_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers --ignore=tests/smoke"

[tool.coverage.run]
source = ["syno_workspace_mcp"]
branch = true
